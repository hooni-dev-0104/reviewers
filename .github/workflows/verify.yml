name: verify-without-production
on:
  pull_request:
  push:
    branches: ['feat/**']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: python -m unittest discover -s tests -v
      - run: npm --prefix apps/web ci --ignore-scripts
      - run: npm --prefix apps/web test
      - run: npm --prefix apps/web run build
      - name: Isolated SQL verification
        run: |
          npm install --prefix "$RUNNER_TEMP/reviewkok-db" --no-audit --no-fund @electric-sql/pglite@0.3.14
          PGLITE_MODULE="file://$RUNNER_TEMP/reviewkok-db/node_modules/@electric-sql/pglite/dist/index.js" node apps/web/tests/sql-events.check.mjs
